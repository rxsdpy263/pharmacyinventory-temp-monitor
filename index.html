<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกอุณหภูมิคลังยา</title>
    <!-- เรียกใช้งาน Chart.js สำหรับทำกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: #0288d1; text-align: center; font-size: 1.3rem; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.9rem; }
        select, input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        button { background: #0288d1; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 8px; font-size: 1rem; width: 100%; font-weight: bold; margin-top: 5px; }
        button:active { background: #01579b; }
        .toggle-btn { background: #4caf50; margin-top: 15px; }
        .chart-container { position: relative; width: 100%; height: 300px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        th, td { border: 1px solid #eee; padding: 8px; text-align: center; }
        th { background: #e1f5fe; color: #01579b; }
        .hidden { display: none; }
        .loading { text-align: center; color: #666; font-style: italic; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌡️ บันทึกอุณหภูมิคลังยา</h2>
    
    <div class="form-group">
        <label>เลือกจุดวัด:</label>
        <select id="location" onchange="updateChart()">
            <option value="เครื่องวัดที่ 1 (โซน A)">เครื่องวัดที่ 1 (โซน A)</option>
            <option value="เครื่องวัดที่ 2 (โซน B)">เครื่องวัดที่ 2 (โซน B)</option>
            <option value="เครื่องวัดที่ 3 (โซน C)">เครื่องวัดที่ 3 (โซน C)</option>
            <option value="เครื่องวัดที่ 4 (โซน D)">เครื่องวัดที่ 4 (โซน D)</option>
            <option value="ตู้เย็นเก็บยาหลัก">ตู้เย็นเก็บยาหลัก</option>
        </select>
    </div>

    <div class="form-group">
        <label>รอบเวลาบันทึก:</label>
        <select id="session">
            <option value="รอบเช้า">รอบเช้า</option>
            <option value="รอบบ่าย">รอบบ่าย</option>
        </select>
    </div>

    <div class="form-group">
        <label>อุณหภูมิ (°C):</label>
        <input type="number" id="temp" step="0.1" placeholder="เช่น 25.5">
    </div>

    <div class="form-group">
        <label>ความชื้น (%RH - ถ้ามี):</label>
        <input type="number" id="humidity" step="1" placeholder="เช่น 60">
    </div>

    <div class="form-group">
        <label>ผู้บันทึก:</label>
        <input type="text" id="recorder" placeholder="ชื่อผู้บันทึก">
    </div>

    <button onclick="sendData()">บันทึกข้อมูล</button>
    <div id="loading" class="loading hidden">กำลังส่งข้อมูลขึ้นระบบ...</div>

    <!-- ส่วนแสดงกราฟหลัก -->
    <div class="chart-container">
        <canvas id="tempChart"></canvas>
    </div>

    <!-- ปุ่มสลับดูตาราง -->
    <button class="toggle-btn" onclick="toggleTable()">📁 ซ่อน/แสดง ตารางข้อมูลย้อนหลัง</button>

    <!-- ตารางซ่อนไว้ -->
    <div id="tableContainer" class="hidden">
        <table>
            <thead>
                <tr>
                    <th>วัน-เวลา</th>
                    <th>รอบ</th>
                    <th>อุณหภูมิ</th>
                    <th>ความชื้น</th>
                    <th>ผู้บันทึก</th>
                </tr>
            </thead>
            <tbody id="logTable">
                <tr><td colspan="5">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ⚠️ แทนที่ด้วย URL ของ Google Apps Script ที่คุณDeploy
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5wVnpUunEYzaF2AKfzhEPATMRRRrhTh4I5hFfk7JF9dFcRi9gQ-LhXUMuehRdd3wv/exec";

    let allData = [];
    let myChart = null;

    // โหลดข้อมูลทันทีที่เปิดเว็บ
    window.onload = function() {
        fetchData();
    };

    function sendData() {
        let location = document.getElementById('location').value;
        let session = document.getElementById('session').value;
        let temp = document.getElementById('temp').value;
        let humidity = document.getElementById('humidity').value || '-';
        let recorder = document.getElementById('recorder').value;

        if(!temp || !recorder) {
            alert('กรุณากรอกอุณหภูมิและชื่อผู้บันทึก');
            return;
        }

        let payload = { location, session, temp, humidity, recorder };
        
        document.getElementById('loading').classList.remove('hidden');

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
            document.getElementById('loading').classList.add('hidden');
            alert('บันทึกข้อมูลสำเร็จ!');
            document.getElementById('temp').value = '';
            document.getElementById('humidity').value = '';
            document.getElementById('recorder').value = '';
            fetchData(); // ดึงข้อมูลใหม่มาอัปเดตกราฟ
        })
        .catch(err => {
            document.getElementById('loading').classList.add('hidden');
            alert('เกิดข้อผิดพลาดในการบันทึก');
            console.error(err);
        });
    }

    function fetchData() {
        fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
            allData = data;
            updateChart();
            updateTable();
        })
        .catch(err => console.error('Error fetching data:', err));
    }

    function updateChart() {
        let selectedLoc = document.getElementById('location').value;
        
        // กรองข้อมูลเฉพาะจุดวัดที่เลือก
        let filtered = allData.filter(item => item.Location === selectedLoc);
        
        // เอาแค่ 20 รายการล่าสุดเพื่อให้กราฟไม่อัดแน่นเกินไป
        filtered = filtered.slice(-20);

        let labels = filtered.map(item => {
            let d = new Date(item.Timestamp);
            return `${d.getDate()}/${d.getMonth()+1} (${item.Session || 'รอบเช้า'})`;
        });
        let temps = filtered.map(item => parseFloat(item.Temperature));
        let humids = filtered.map(item => item.Humidity === '-' ? null : parseFloat(item.Humidity));

        let ctx = document.getElementById('tempChart').getContext('2d');
        
        if (myChart) {
            myChart.destroy();
        }

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'อุณหภูมิ (°C)',
                        data: temps,
                        borderColor: '#0288d1',
                        backgroundColor: 'rgba(2, 136, 209, 0.1)',
                        borderWidth: 2,
                        tension: 0.2,
                        yAxisID: 'y'
                    },
                    {
                        label: 'ความชื้น (%RH)',
                        data: humids,
                        borderColor: '#4caf50',
                        backgroundColor: 'rgba(76, 175, 80, 0.1)',
                        borderWidth: 2,
                        tension: 0.2,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        type: 'linear',
                        position: 'left',
                        title: { display: true, text: 'อุณหภูมิ (°C)' }
                    },
                    y1: {
                        type: 'linear',
                        position: 'right',
                        grid: { drawOnChartArea: false },
                        title: { display: true, text: 'ความชื้น (%RH)' }
                    }
                }
            }
        });
    }

    function updateTable() {
        let tableHTML = '';
        // เรียงจากใหม่ไปเก่า
        let reversed = [...allData].reverse();
        
        reversed.forEach(item => {
            let d = new Date(item.Timestamp).toLocaleString('th-TH');
            tableHTML += `<tr>
                <td>${d}</td>
                <td>${item.Session || '-'}</td>
                <td>${item.Location}</td>
                <td><b>${item.Temperature}</b></td>
                <td>${item.Humidity}</td>
                <td>${item.Recorder}</td>
            </tr>`;
        });
        
        if(reversed.length === 0) {
            tableHTML = `<tr><td colspan="6">ยังไม่มีข้อมูล</td></tr>`;
        }
        
        // ปรับหัวตารางให้ตรงกับข้อมูล
        document.querySelector('#tableContainer table thead tr').innerHTML = `
            <th>วัน-เวลา</th><th>รอบ</th><th>จุดวัด</th><th>อุณหภูมิ</th><th>ความชื้น</th><th>ผู้บันทึก</th>
        `;
        document.getElementById('logTable').innerHTML = tableHTML;
    }

    function toggleTable() {
        let t = document.getElementById('tableContainer');
        t.classList.toggle('hidden');
    }
</script>

</body>
</html>
